<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Fermer</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
button{position:absolute;top:8px;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:28px;line-height:1;display:grid;place-items:center;padding:0;
  background:rgba(15,15,22,.6);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);backdrop-filter:blur(8px);opacity:.75;transition:opacity .3s,background .2s}
#x{right:8px}#h{right:72px}
#x:hover{opacity:1;background:rgba(224,48,30,.92)}#h:hover{opacity:1;background:rgba(255,106,43,.92)}
.dot{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);display:none}
body.mini button{display:none}body.mini .dot{display:block}
</style></head>
<body class="full"><i class="dot"></i>
<button id="h" aria-label="Retour à l'accueil (l'appli continue)"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
<button id="x" aria-label="Fermer l'application">&#10005;</button>
<script>
document.getElementById('x').onclick=()=>window.ov.close();
document.getElementById('h').onclick=()=>window.ov.home();
document.documentElement.addEventListener('mouseenter',()=>window.ov.hover());
document.documentElement.addEventListener('mouseleave',()=>window.ov.leave());
</script></body></html>
